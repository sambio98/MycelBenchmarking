campaign_id: ecaudit-fmn-dh-1_1_3_15-01
template_id: ec-domain-audit
track: EX
family: annotation_evidence_audit
layer: L2_enzyme_and_function
np_class: mixed
version: 1.0.0
horizon_tier: T-short
license_class: open
grader_version: "2.0.0+9fc95658"
grading_spec_version: "1.0.0"
min_tool_surface: S1
tool_surface_note: >
  The first campaign in the benchmark that executes a tool. It needs HMMER on the
  path and the pinned Pfam release in the image; S0 cannot answer any rung of it,
  which is the declared reason its S0 column will read as tooling rather than as
  capability.

license_notice:
  source: UniProtKB release 2026_03, all entries annotated EC 1.1.3.15
  license: CC BY 4.0
  attribution: >
    UniProt Consortium, UniProtKB release 2026_03
    (https://www.uniprot.org/), licensed CC BY 4.0.
  redistribution: >
    inputs/ carries the UniProt FASTA unchanged apart from concatenating the two
    sections; CC BY 4.0 requires attribution and nothing further. The Pfam library
    the audit scans against is NOT redistributed: it is read from the pinned image
    at the declared path, and reference/audit_rules.json records its provider,
    version and sha256 instead.

objective: >
  EC 1.1.3.15 names an FMN-dependent (S)-2-hydroxy-acid oxidase, so every sequence
  carrying that annotation implies the FMN_dh domain. Run the pinned HMMER against
  the declared Pfam model panel at the declared threshold, report which sequences
  carry the canonical domain and which do not, and describe what the ones that do
  not carry instead. Then say how much of the answer survives a change of cutoff,
  and how much of it depends on where the line between "different enzyme" and
  "misannotated" is drawn.

method_guidance: partial

scope_note: >
  Gold here is the tool's output, computed in-container against a pinned model
  library at a declared threshold -- tier G1. It is never the misannotation rate
  reported in the literature: Rembeza & Engqvist 2021 (PLoS Comput Biol
  17(9):e1009446) found that 78% of EC 1.1.3.15 proteins in BRENDA 2017.1 lacked
  the FMN-dh domain, and that figure is the reason this row is in the catalog, but
  quoting it as gold would make the campaign a literature-recall test and would be
  wrong about UniProt 2026_03 besides. The measured figure here is 17.6% of the
  unreviewed section, and 0 of 29 reviewed entries.

  Three things are load-bearing. The model panel is DECLARED rather than
  discovered, so the task is applying the tool correctly and not running an
  open-ended Pfam search. The threshold is declared, because an HMM verdict is a
  function of its cutoff. And absence of the canonical domain is NOT the same as
  misannotation: this set's canonical-absent sequences are overwhelmingly a real,
  coherent enzyme family, so the campaign computes absence and grades the
  misannotation count under each of three published policies rather than asserting
  one.

catalog_deviation: >
  The catalogued R4 was "a sequence is mutated to disrupt the FMN-dh domain --
  predict the reclassification". Mutating a sequence to destroy an HMM match means
  choosing which residues to break, and any choice large enough to drop the match
  below a curated gathering threshold is a choice about the answer; worse, the
  gold would then be a statement about a sequence nobody deposited. R4 instead
  varies two axes that are already in the data: the declared cutoff, and the
  declared policy on which architectures count as acceptable for this EC number.
  The second moves the verdict for 967 sequences, which is the whole campaign.

  The catalogued discrimination ECs (1.13.12.4, 1.1.2.3, 1.1.99.31) are not used.
  Two of them are small (204 and 234 entries) and the third, L-lactate
  dehydrogenase (cytochrome), is itself an FMN_dh family member with 5,501
  entries, so the canonical domain does not discriminate it from EC 1.1.3.15 at
  all. Bringing them in would have added three sequence sets and no signal.

template_params:
  sequence_input: inputs/ec_1_1_3_15_uniprot_2026_03.fasta.gz

output_contract:
  domain_audit.json:
    release / ec_number / canonical_model / threshold: >
      From the shipped provenance and the pinned rules.
    hmmer_version / pfam_version / pfam_sha256: >
      What the audit actually ran against. A domain verdict is only as pinned as
      the tool and the library that produced it.
    sequences_total / sequences_by_section: >
      All shipped sequences, and the UniProt reviewed/unreviewed split read from
      the FASTA headers.
    model_panel_size: The number of declared Pfam models scored.
    canonical_present_by_section / canonical_absent_by_section: >
      Per section, sequences carrying the canonical model at the declared
      threshold, and those not.
    canonical_absent_total: The size of the canonical-absent set.
    family_census / absent_family_census: >
      Per declared model, how many sequences carry it -- over the whole set, and
      over the canonical-absent set.
    architecture_census / absent_architecture_census: >
      The distribution of domain contents, as sorted model names joined by ' + '
      or '(none)'; over the whole set and over the canonical-absent set.
    dominant_absent_architecture: >
      The most common architecture among the canonical-absent sequences, under
      the declared tie-break (count, then name).
    length_profile: >
      Count, minimum, median, maximum and the per-band short-sequence counts for
      the canonical-present and canonical-absent sides.
    misannotated_by_policy: >
      Per declared policy, how many sequences carry no accepted architecture.
    threshold_absent: >
      Per declared threshold variant, the size of the canonical-absent set.

constraints:
  reference_dir: reference
  pinned_tables:
    - reference/audit_rules.json   # panel, threshold, policies, length bands
  external_resources:
    - name: pfam_a_hmm
      declared_in: reference/audit_rules.json
      reason: >
        1.5 GB, read from the pinned image rather than shipped. Pfam is CC0, so
        this is a size decision and not a licence one; the campaign records the
        provider, version and sha256 in place of the bytes.

snapshots_required:
  shipped: [uniprot@2026_03]
  fetched: []
  image: [hmmer@3.4, pfam@35.0]

budgets:
  wall_clock_minutes: 25
  cpu: 2
  memory_gb: 4
  network: off

rungs:
  - {rung_id: r1, ordinal: 1, name: execute,        gold_tier: G1, warm_start_bundle: null}
  - {rung_id: r2, ordinal: 2, name: correct,        gold_tier: G1, warm_start_bundle: gold/warm/r2}
  - {rung_id: r3, ordinal: 3, name: commit,         gold_tier: G1, warm_start_bundle: gold/warm/r3}
  - {rung_id: r4, ordinal: 4, name: counterfactual, gold_tier: G1, warm_start_bundle: gold/warm/r4}

# Nothing is planted here: the traps this campaign grades -- the fragment
# explanation and the domtblout column order -- are supplied by the data and the
# tool rather than inserted, so the element is not claimed.
structural_elements: [verification, counterfactual, control]

harness:
  gold_command: ["python3", "-m", "npbench_c.templates.ec_domain_audit.build", "{campaign}"]
  solve_command: ["python3", "-m", "npbench_c.templates.ec_domain_audit.solve", "{campaign}", "{submission}"]
  measure_command: ["python3", "-m", "npbench_c.templates.ec_domain_audit.measure", "{campaign}", "{submission}", "{measurement}"]
  stub_module: npbench_c.sweep.stubs.stub_ecaudit
  stub_args: []
  stub_levels:
    - {name: stub-reader,      level: reader}
    - {name: stub-presence,    level: presence, reference: true}
    - {name: stub-architecture, level: architecture}
    - {name: stub-complete,    level: complete}
    - {name: stub-inverted,    level: inverted}
    - {name: stub-noncompute,  level: noncompute, mode: no_tool}

grading:
  chance_levels: {r1: 1.0, r2: 0.002, r3: 0.001, r4: 0.001}
  chance_level_notes:
    r1: >
      Nominal rather than measured. The sequence counts and the panel size cannot
      be guessed, so the no-tool ablation fails R1 outright; the level stays at
      1.0 because any system that opens the FASTA clears it, and the capped floor
      is computed over R2 upward.

excluded_from_grading:
  - field: the per-sequence accession lists
    reason: >
      The per-sequence accession list would dominate the conjunctive product while
      testing one tool call repeatedly. The per-section counts, the architecture distribution,
      the dominant architecture and the per-policy counts carry the claim, and a
      system that misassigns a sequence shows up in one of them.
  - field: whether a canonical-absent sequence is "really" misannotated
    reason: >
      Not decidable from domain content. EC 1.1.3.15 names the FMN enzyme, and the
      FAD-linked glycolate oxidase subunits that dominate the absent set oxidise
      the same substrate with a different cofactor -- a different enzyme under a
      defensible reading of the same annotation. The campaign grades the counts
      under each declared policy instead, and the p0/p1 gap is the honest
      statement of the uncertainty.
  - field: the misannotation rate reported in the literature
    reason: >
      Rembeza & Engqvist measured BRENDA 2017.1; this campaign measures UniProt
      2026_03 and gets a different number. Grading the paper's figure would be a
      G3 tier and a recall test.
  - field: the Pfam library itself
    reason: >
      1.5 GB and not redistributed. The campaign pins its provider, version and
      sha256; the audit refuses to emit gold if the file it finds does not match.

notes_for_audit:
  - >
    Check the fragment explanation first, because it is the one that would make
    the whole campaign an artefact. If the canonical-absent sequences were shorter
    than the 348-column model, "lacks the domain" would partly mean "too short to
    score". Measured, they are LONGER: median 466 against 367, and 2.4% of them
    are under 300 residues against 12.6% of the canonical-present side. The
    profile is graded so an auditor can see this rather than take it on trust.
  - >
    The reviewed section is the control and it is clean: 29 of 29 reviewed entries
    carry FMN_dh, and every one of them has that architecture and nothing else
    from the panel. The 17.6% canonical-absent rate is entirely a property of the
    unreviewed section.
  - >
    The threshold counterfactual barely moves the answer -- 1,342 to 1,371 absent
    across six cutoffs, with --cut_ga, --cut_nc and --cut_tc identical. That is a
    robustness result, not a defect in the rung: the policy counterfactual in the
    same rung moves the verdict for 967 sequences, so R4 is not resting on the
    inert axis. The build refuses to emit gold if the policy axis stops moving.
  - >
    The panel partitions this set perfectly: all 6,329 canonical-present sequences
    carry FMN_dh and nothing else from the panel. That is worth checking on any
    re-instantiation, because a panel that overlapped the canonical model would
    make the architecture census ambiguous.
