tool_surface_note: >
  Needs one spectral-similarity library and nothing else. R1 reports the graph
  itself -- which pairs of the shipped spectra clear the declared threshold -- so
  the no-tool ablation fails the first rung, and every rung above it is a
  projection of the same two similarity calls.

