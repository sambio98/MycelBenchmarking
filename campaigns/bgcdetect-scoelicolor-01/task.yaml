campaign_id: bgcdetect-scoelicolor-01
template_id: bgc-detection
track: EX
family: boundary_and_robustness
layer: L3_cluster_and_pathway
np_class: mixed
version: 1.0.0
horizon_tier: T-short
license_class: open
grader_version: "2.0.0+9fc95658"
grading_spec_version: "1.0.0"
min_tool_surface: S2
tool_surface_note: >
  The benchmark's first S2 campaign. It needs antiSMASH 8.0.4 with its database
  layer, and it reads the three detection rule files from the image rather than
  shipping them. No S0 or S1 system can answer any rung. The campaign invokes the
  tool five times -- once per declared deletion variant, including the identity
  control -- at roughly 75 seconds each over the complete chromosome.

license_notice:
  source: >
    NCBI Nucleotide AL645882.2 (Streptomyces coelicolor A3(2) complete
    chromosome) and the curated cluster boundaries MIBiG 4.0 maps to it
  license: >
    GenBank records carry no copyright claim; MIBiG 4.0 is CC BY 4.0
  attribution: >
    Streptomyces coelicolor A3(2) chromosome AL645882.2 from NCBI Nucleotide;
    curated cluster boundaries from MIBiG 4.0
    (https://mibig.secondarymetabolites.org/), licensed CC BY 4.0.
  redistribution: >
    inputs/ carries the complete GenBank record (6.8 MB gzipped) and a 15-row
    extract of MIBiG's locus table for this accession. The antiSMASH detection
    rule files are NOT redistributed: they are AGPL-3.0-or-later package data, so
    the campaign reads them from the pinned image and records their paths, the
    provider, the version and a fingerprint instead.

objective: >
  Run the pinned antiSMASH over the complete chromosome, report every region it
  calls under the declared coordinate convention, and reconcile those calls with
  the boundaries MIBiG curates for the same accession: which curated clusters are
  detected, by how much the called region exceeds them, and how many called
  regions have no curated counterpart at all. Then delete the declared core
  biosynthetic genes of one region at a time and say what the region set does.

method_guidance: partial

scope_note: >
  Gold is the declared projection of the tool's own output and exact arithmetic
  over it, tier G1 throughout. No rung asks whether a region "is" a biosynthetic
  gene cluster; every verdict is a statement about two interval sets.

  Five things are load-bearing and each was settled by measurement.

  The input is the COMPLETE chromosome, never a slice. Slicing fails twice over: it
  truncates CDS features at the slice edges and antiSMASH refuses the record
  ("feature translation extends out of record"), and a region reaching the slice
  edge has its boundary set by the window rather than by the detection rules.
  Measured on an 81 kb window around the actinorhodin cluster, antiSMASH returned
  one region running to the record end with contig_edge=True. On the whole
  chromosome no region reaches an edge, and a minimal run takes on the order of a
  minute, so the slice bought nothing.

  The two coordinate conventions differ, and the difference was VERIFIED rather
  than assumed: antiSMASH writes 0-based half-open, and MIBiG's from/to are
  1-based inclusive, which is established by BGC0000194's `to` of 5,535,091 being
  exactly where SCO5092 ends in AL645882.2.

  Extent is the question, not detection alone: antiSMASH extends a region from the
  protocluster core by a class-dependent distance, so the vocabulary grades how
  much larger the call is and the Jaccard index is graded with it.

  A called region overlapping no curated locus is not thereby a false positive.
  MIBiG records what has been characterised, which is not the same as what exists,
  so the count is reported rather than scored as an error against either resource.

  And the deletion targets are NAMED in the rules rather than discovered at solve
  time, so the counterfactual is published and deterministic.

catalog_deviation: >
  Two departures, both forced by what the pinned tool makes available.

  The catalogued R2 asked for boundaries matching gold "by overlap-F1 within
  measured tolerance". There is no tolerance to measure: the tool is pinned and
  its output on this input is deterministic, so the coordinates are graded
  exactly. The tolerance belonged to a design that compared across versions, which
  this benchmark forbids outright -- the detection rule set went from 58 rules at
  v5 to 88 at v7.1 to 103 at 8.0.4, and the rule fingerprint is graded for that
  reason.

  The catalogued R3 asked for "the boundary-defining gene, closed enum". It is not
  asked, because a region's boundary in antiSMASH 8 is set by a class-dependent
  extension from the protocluster core rather than by a gene sitting at the edge,
  so the honest answer is a rule and an offset rather than a gene. What R3 grades
  instead is the reconciliation against the curated boundary, which is a sharper
  claim and is decided entirely by arithmetic.

template_params:
  genbank_input: inputs/AL645882.2.gb.gz
  curated_loci_input: inputs/mibig_loci_AL645882.2.json

output_contract:
  detection_report.json:
    accession / record_length / coordinate_convention / search_flags: >
      The shipped record, and the declared convention and invocation.
    antismash_version / detection_rule_fingerprint: >
      Which tool and which rule set produced the region call. A region set is a
      function of the rules, so this is part of the answer and not metadata.
    regions / distinct_products / product_census: >
      How many regions were called, how many distinct products they carry, and
      the count per product.
    contig_edge_regions: >
      Regions touching a record edge. Zero on this input, and a non-zero value
      means the boundaries are the record's rather than the tool's.
    region_bases / fraction_of_record: >
      Total bases inside regions, and that as a fraction of the record.
    region_table: >
      Every region: number, 0-based half-open start and end, the same interval as
      1-based inclusive, length, sorted products, and the contig-edge flag.
    region_span: Minimum, median and maximum region length.
    loci_total / verdict_census / per_locus: >
      The curated loci, the count per declared extent verdict, and per locus the
      verdict, the matched region, the fraction of the locus covered and the
      Jaccard index.
    regions_matching_a_locus / regions_without_a_locus: >
      How many called regions overlap a curated locus, and how many do not.
    regions_holding_several_loci: >
      Region numbers containing more than one curated locus.
    jaccard_median / jaccard_min / jaccard_max: The extent agreement summary.
    deletion_outcomes: >
      Per declared variant, the genes deleted and what the region set did: how
      many regions, how many lost, gained and unchanged, and the products
      involved.

constraints:
  reference_dir: reference
  pinned_tables:
    - reference/detection_rules.json   # invocation, conventions, verdicts, deletions
  external_resources:
    - name: antismash_detection_rules
      declared_in: reference/detection_rules.json
      reason: >
        antiSMASH package data under AGPL-3.0-or-later, so not redistributable
        here. The campaign records the three paths, the provider, the version and
        a sha256 over the files in declared order; the build refuses to emit gold
        if the fingerprint does not match, because a region set computed against a
        different rule set is not this campaign's gold.

snapshots_required:
  shipped: [genbank@AL645882.2, mibig@4.0]
  fetched: []
  image: [antismash@8.0.4, antismash_databases@2026-10-02]

budgets:
  wall_clock_minutes: 60
  cpu: 2
  memory_gb: 8
  network: off
  budget_note: >
    Five antiSMASH invocations at roughly 75 seconds each, plus reading a 26 MB
    record five times. The budget is more than twice the benchmark's usual 25
    minutes because this is the first campaign whose tool cost is measured in
    minutes rather than seconds, and a budget that forced a system to skip the
    counterfactual would measure the budget.

rungs:
  - {rung_id: r1, ordinal: 1, name: execute,        gold_tier: G1, warm_start_bundle: null}
  - {rung_id: r2, ordinal: 2, name: correct,        gold_tier: G1, warm_start_bundle: gold/warm/r2}
  - {rung_id: r3, ordinal: 3, name: commit,         gold_tier: G1, warm_start_bundle: gold/warm/r3}
  - {rung_id: r4, ordinal: 4, name: counterfactual, gold_tier: G1, warm_start_bundle: gold/warm/r4}

# Nothing is planted. The traps are the record's own: a slice would set the
# boundaries, the two resources count coordinates differently, and half of what
# the tool finds has no curated counterpart.
structural_elements: [verification, counterfactual, control]

harness:
  gold_command: ["python3", "-m", "npbench_c.templates.bgc_detection.build", "{campaign}"]
  solve_command: ["python3", "-m", "npbench_c.templates.bgc_detection.solve", "{campaign}", "{submission}"]
  measure_command: ["python3", "-m", "npbench_c.templates.bgc_detection.measure", "{campaign}", "{submission}", "{measurement}"]
  stub_module: npbench_c.sweep.stubs.stub_bgcdetect
  stub_args: []
  stub_levels:
    - {name: stub-reader,        level: reader, timeout_s: 3600}
    - {name: stub-boundaries,    level: boundaries, reference: true, timeout_s: 3600}
    - {name: stub-reconcile,     level: reconcile, timeout_s: 3600}
    - {name: stub-complete,      level: complete, timeout_s: 3600}
    - {name: stub-offbyone,      level: offbyone, timeout_s: 3600}
    - {name: stub-noncompute,    level: noncompute, mode: no_tool, timeout_s: 600}

grading:
  chance_levels: {r1: 1.0, r2: 0.001, r3: 0.001, r4: 0.001}
  chance_level_notes:
    r1: >
      Nominal rather than measured. The region count, the product census and the
      rule fingerprint cannot be guessed, so the no-tool ablation fails R1
      outright; the level stays at 1.0 because any system that runs the tool
      clears it, and the capped floor is computed over R2 upward.

excluded_from_grading:
  - field: the boundary-defining gene
    reason: >
      Not well posed under antiSMASH 8. A region's boundary is set by a
      class-dependent extension from the protocluster core, not by a gene at the
      edge, so the honest answer would be a rule name and an offset rather than a
      gene. The catalogued design asked for it; the reconciliation against the
      curated boundary is the sharper claim and replaces it.
  - field: whether a called region is "really" a biosynthetic gene cluster
    reason: >
      Not decidable from detection output, and not what the campaign asks. Every
      verdict here compares two interval sets. In particular the 15 regions with no
      curated counterpart are not thereby false positives: MIBiG records what has
      been characterised, which is not the same as what exists.
  - field: the full HTML output and the complete JSON
    reason: >
      The graded artifact is the declared projection -- per region the
      coordinates, the sorted products and the contig-edge flag. The JSON is 20 MB
      and carries the input path, the tool version, a timestamp and the whole HMM
      hit table in the same object; none of that is a result.
  - field: cross-version comparison of any kind
    reason: >
      Forbidden outright. The detection rule set grew from 58 rules at v5 to 88 at
      v7.1 to 103 at 8.0.4, so a region set is a function of the rules that
      produced it. The rule fingerprint is graded so a rule change is detectable
      even when the version string is not what moved.

notes_for_audit:
  - >
    Check the contig-edge count first. It must be zero, and if it is not then the
    boundaries being graded are the record's rather than the detection rules'.
    That is the whole reason this campaign ships a complete chromosome instead of
    five small windows: measured on an 81 kb window around the actinorhodin
    cluster, antiSMASH returned a region running to the record end.
  - >
    Then check the coordinate conversion on one row. antiSMASH writes 0-based
    half-open and MIBiG 1-based inclusive, and the region table reports both forms
    so the off-by-one is visible rather than buried. The conversion is verified
    against the source annotation: MIBiG's `to` for BGC0000194 is 5,535,091, which
    is exactly where SCO5092 ends in AL645882.2.
  - >
    The extent verdicts are the finding, and the direction is one-sided: a curated
    locus sits inside the called region far more often than the reverse. antiSMASH
    overcalls extent by design -- it extends from the protocluster core by a
    class-dependent distance -- and this campaign measures by how much rather than
    calling it an error.
  - >
    A curated locus can sit inside another -- the SCB1 butyrolactone genes lie
    within the coelimycin cluster -- so two loci can land in one called region and
    a one-to-one join would silently drop one. The reconciliation reports which
    regions hold several loci for that reason.
  - >
    Whether deleting one of a pair of core genes is as fatal as deleting both is a
    property of the detection rule, so v1 and v2 differ by exactly that and the
    answer is measured rather than assumed. v5 deletes a gene antiSMASH marks
    biosynthetic-additional rather than core, which is the rung's negative
    control: without it, 'a deletion costs a region' would be a free answer.
