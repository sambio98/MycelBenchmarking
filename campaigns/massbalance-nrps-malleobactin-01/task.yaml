campaign_id: massbalance-nrps-malleobactin-01
template_id: mass-balance-nrps
track: EX
family: mass_balance_and_route_validation
layer: L4_molecule_and_structure
np_class: NRPS
version: 1.0.0
horizon_tier: T-short
license_class: open
grader_version: "2.0.0+9fc95658"
grading_spec_version: "1.1.0"
min_tool_surface: S0

objective: >
  MIBiG entry BGC0000386 annotates a four-module NRPS assembly line in
  Burkholderia thailandensis E264 and four malleobactin congeners. Compute the
  molecular formula of the linear assembly those modules would produce, quantify
  how far each annotated congener is from it, and predict the assembly that
  results from deleting each single module.

method_guidance: partial

scope_note: >
  MIBiG annotates the enzymatic module count, which is not the number of monomer
  incorporations in the final product: iterative module reuse, non-NRPS moieties
  such as fatty-acid starters and prenyl groups, and metal coordination all break
  the correspondence. Across the 43 entries meeting this template's admission
  filter, only one is exactly balanced and four differ by a single water. A
  non-zero residual is therefore the normal case, and quantifying it is the task.
  This campaign does not ask which chemistry closes the gap -- that would be
  judgement, not computation.

output_contract:
  route.json:
    modules: >
      One object per annotated module, in module order, each with the 1-based
      "module" index, the "monomer" name exactly as the entry's
      a_domain.substrates[].name gives it, and that monomer's "formula".
    formula_format: >
      Hill order -- carbon, then hydrogen, then other elements alphabetically --
      with the count omitted when it is 1. Element order is pinned in
      reference/assembly_rules.json. A formula written in another order is
      re-rendered before comparison, so presentation is not graded; chemistry is.
    peptide_bonds: integer; n_modules - 1 for a linear assembly
    naive_assembly_formula: Hill-order formula of the linear assembly
    naive_assembly_monoisotopic_mass: daltons, 4 decimal places, tolerance 0.001
    per_compound: >
      One object per formula-bearing compound the entry annotates, keyed by the
      compound name exactly as the entry gives it. Each carries "residual"
      (product minus naive assembly, element by element, signed, elements with a
      zero difference may be omitted) and "verdict" from the closed vocabulary.
    single_module_deletions: >
      Keyed by the 1-based module index as a string. Each carries the Hill-order
      "formula" of the assembly remaining after that module is deleted and the
      "mass_shift" in daltons relative to the full assembly. A map, not a list,
      so the answer is not order-dependent.
    verdict_vocabulary: [balanced, cyclisation_only, additional_chemistry_required,
                         deficit_unexplained, insufficient]

constraints:
  reference_dir: reference
  pinned_tables:
    - reference/monomer_formulas.json   # monomer formulas, derived from the entry's SMILES
    - reference/assembly_rules.json     # element order, peptide-bond rule, residual and verdict rules
    - reference/atomic_masses.json      # monoisotopic atomic masses

snapshots_required:
  shipped: [mibig@4.0]
  fetched: []
  inputs_pinned:
    - source: MIBiG
      version: "4.0"
      accession: BGC0000386
      sha256_entry: d695bbe8743228a7
      license: CC BY 4.0
      admission: loci[].evidence contains "Knock-out studies"

budgets:
  wall_clock_minutes: 20
  cpu: 2
  memory_gb: 4
  network: off

rungs:
  - {rung_id: r1, ordinal: 1, name: execute,        gold_tier: G1, warm_start_bundle: null}
  - {rung_id: r2, ordinal: 2, name: correct,        gold_tier: G1, warm_start_bundle: gold/warm/r2}
  - {rung_id: r3, ordinal: 3, name: commit,         gold_tier: G1, warm_start_bundle: gold/warm/r3}
  - {rung_id: r4, ordinal: 4, name: counterfactual, gold_tier: G1, warm_start_bundle: gold/warm/r4}

structural_elements: [verification, counterfactual, planted]

# A campaign of this template contains no code: the oracle is shared at
# npbench_c.templates.mass_balance_nrps, so an instantiation is a data change
# plus one build command.
harness:
  gold_command: ["python3", "-m", "npbench_c.templates.mass_balance_nrps.build", "{campaign}"]
  solve_command: ["python3", "-m", "npbench_c.templates.mass_balance_nrps.solve", "{campaign}", "{submission}"]
  measure_command: ["python3", "-m", "npbench_c.templates.mass_balance_nrps.measure", "{campaign}", "{submission}", "{measurement}"]
  stub_module: npbench_c.sweep.stubs.stub_massbalance
  stub_args: []
  stub_levels:
    - {name: stub-naive,      level: naive}
    - {name: stub-assembled,  level: assembled}
    - {name: stub-analyst,    level: analyst, reference: true}
    - {name: stub-complete,   level: complete}
    - {name: stub-parametric, level: parametric, mode: no_tool}

grading:
  chance_levels: {r1: 1.0, r2: 0.01, r3: 0.004, r4: 0.0005}
  chance_level_notes:
    r1: >
      Measured by the no-computation ablation in the internal sweep: R1 asks only
      that the entry and the pinned monomer table be read and echoed in schema,
      which a non-computing system does on 3/3 runs. The prior estimate of 0.6
      was wrong and the sweep corrected it. A no-tool ablation is not meaningful
      for an S0 campaign -- there is no tool to withhold -- so the ablation
      withholds computation instead.
    r3: >
      The four verdicts are identical for this entry, so one lucky enum guess
      clears all four verdict components (~1/5, not (1/5)^4). R3's information is
      carried by the four residual vectors, which is what this figure reflects.

excluded_from_grading:
  - field: the enumerated compound list
    reason: >
      It is a field of the shipped entry, and every warm bundle hands it over
      because neither the assembly rung nor the reconciliation rung can be posed
      without knowing which compounds the entry names. Grading it would measure a
      parse the sandbox has already answered. Caught mechanically: the readiness
      gate now refuses a component whose composite gold value sits in the warm
      bundle of the rung that grades it.
  - field: residual attribution to specific tailoring chemistry
    reason: >
      Attributing a residual to a named biosynthetic step (a fatty-acid starter,
      a prenylation, iterative module reuse) is expert inference, not
      computation, and its gold would be human judgement. The signed residual
      vector and a mechanical classification of it are graded instead.
  - field: product monoisotopic mass
    reason: >
      The entry supplies compounds[].mass, so grading it would test transcription
      rather than computation. The assembly mass, which the entry does not
      supply, is graded instead.

notes_for_audit:
  - This entry annotates four congeners including a dimer (malleobactin D,
    C46H80N16O23). All four residuals are computed; taking compounds[0] would
    have baked an undeclared choice into gold.
  - All four verdicts are additional_chemistry_required, so the verdict field
    carries no discriminating power within this campaign; R3's information is in
    the residual vectors. The verdict varies across instantiations of this
    template (sevadicin BGC0000426 is exactly balanced, obafluorin BGC0001437
    differs by one water).
