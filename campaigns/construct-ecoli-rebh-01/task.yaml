campaign_id: construct-ecoli-rebh-01
template_id: construct-design
track: EX
family: construct_and_sequence_design
layer: L6_translation_and_design
version: 1.0.0
horizon_tier: T-short
license_class: open
grader_version: "2.0.0+9fc95658"
grading_spec_version: "1.0.0"

objective: >
  Design a synthetic open reading frame for heterologous expression of the
  flavin-dependent tryptophan 7-halogenase RebH (UniProt Q8KHZ8, sequence
  version 1, 530 aa), then analyse which of the declared design constraints
  actually binds for this protein, and how that changes when the expression
  host changes.

method_guidance: partial

# The ORF contract, pinned so that no legitimate answer can be marked wrong on
# a convention the task never stated (audit form item 4).
output_contract:
  orf_ecoli.fasta:
    description: ORF for Escherichia coli BL21(DE3) in pET-28a(+), NdeI/XhoI
    includes_start_codon: true
    includes_stop_codon: true           # TAA, TAG or TGA as the final codon
    includes_vector_tag: false          # the pET-28a His6 tag is NOT part of the ORF
    alphabet: ACGT
    strand: coding
  orf_streptomyces.fasta:
    description: ORF for Streptomyces coelicolor A3(2) in pSET152, NdeI/XhoI
    includes_start_codon: true
    includes_stop_codon: true
    includes_vector_tag: false
    alphabet: ACGT
    strand: coding
  analysis.json:
    description: per-rung analytical claims
    constraint_vocabulary:                 # closed; the only admissible names
      - forbidden_sites
      - gc_window
      - gc_global
      - homopolymer
      - direct_repeat
      - internal_rbs
    unconstrained_violations: >
      Violation counts measured on the unconstrained optimum -- the sequence in
      which every residue takes its single most-adapted codon under the pinned
      host table, ties broken by lexicographically smallest codon. Counting
      rules: forbidden_sites = site occurrences; gc_window = 50-nt windows
      (step 1) outside the host range; gc_global = 1 if whole-ORF GC is outside
      the host range else 0; homopolymer = maximal runs longer than the limit;
      direct_repeat = distinct 11-mers occurring more than once;
      internal_rbs = occurrences of AGGAGG.
    non_binding_constraints: >
      Constraints whose relaxation does not increase achievable CAI (cost <= 0).
    flipped_constraints: >
      Symmetric difference of the two hosts' non_binding_constraints sets.

# Everything an agent needs to answer every rung is in reference/, which is
# shipped into the sandbox. The oracle loads the same files, so the tables used
# to compute gold and the tables given to the agent cannot drift.
template_params:
  protein_input: inputs/rebh.faa
  hosts:
    ecoli: {host: ecoli_bl21, strategy: pet28a_ndei_xhoi}
    streptomyces: {host: streptomyces_coelicolor, strategy: pset152_ndei_xhoi}

constraints:
  reference_dir: reference
  pinned_tables:
    - reference/codon_tables.json        # per-host weights, GC global and window ranges
    - reference/cloning_strategies.json  # forbidden sites per strategy
    - reference/composition_limits.json  # homopolymer, repeat, window, RBS, counting rules

snapshots_required:
  shipped: []
  fetched: []
  inputs_pinned:
    - source: UniProtKB
      accession: Q8KHZ8
      sequence_version: 1
      length_aa: 530
      sha256_sequence: 2853460230442a06
      license: CC BY 4.0

budgets:
  wall_clock_minutes: 25
  cpu: 2
  memory_gb: 4
  network: off

# Warm starts are pre-rendered bundles, never whole gold files: copying
# gold/gold.json to give a rung "the previous answer" would also hand over the
# answer that rung is being asked to compute.
rungs:
  - {rung_id: r1, ordinal: 1, name: execute,        gold_tier: G1, warm_start_bundle: null}
  - {rung_id: r2, ordinal: 2, name: correct,        gold_tier: G1, warm_start_bundle: gold/warm/r2}
  - {rung_id: r3, ordinal: 3, name: commit,         gold_tier: G1, warm_start_bundle: gold/warm/r3}
  - {rung_id: r4, ordinal: 4, name: counterfactual, gold_tier: G1, warm_start_bundle: gold/warm/r4}

# A campaign of this template contains no code: the engine and both ladders are
# shared at npbench_c.templates.construct_design, so an instantiation is a data
# change plus one build command.
harness:
  gold_command: ["python3", "-m", "npbench_c.templates.construct_design.design.build", "{campaign}"]
  solve_command: ["python3", "-m", "npbench_c.templates.construct_design.design.solve", "{campaign}", "{submission}"]
  measure_command: ["python3", "-m", "npbench_c.templates.construct_design.design.measure", "{campaign}", "{submission}", "{measurement}"]
  stub_module: npbench_c.sweep.stubs.stub_system
  stub_args: []
  stub_levels:
    - {name: stub-naive,       level: naive}
    - {name: stub-constrained, level: constrained}
    - {name: stub-analyst,     level: analyst, reference: true}
    - {name: stub-complete,    level: complete}
    - {name: stub-parametric,  level: parametric, mode: no_tool}

structural_elements: [verification, abstention_free, counterfactual]

# Quantities deliberately NOT graded, with the measurement that excluded them.
excluded_from_grading:
  - field: binding_cost
    reason: >
      Cross-optimiser spread exceeds the between-constraint signal -- the
      gap from that constraint's mean cost to the nearest other constraint's
      -- for 4 of six constraints in the primary host and 1 of six in the
      swap host, so the magnitude is not gradable. The argmax is stable
      across all four optimiser policies and is graded instead. Recomputable
      by running the four policies in core.OPTIMIZER_POLICIES over the
      shipped tables. The spreads themselves are not printed here: the
      widest of them belongs to the constraint R3 and R4 are asked to name.
      They are in gold/gold.json, which the sandbox never sees.
  - field: cai_full
    reason: >
      The four legitimate optimiser policies disagree about cai_full by more
      than the 0.025 margin the floor is set with, so the magnitude is not
      gradable. Graded as a floor instead -- 0.888 in the primary host and
      0.88 in the swap host, each set that margin below the worst of the
      four policies -- so a different valid optimiser is never penalised.
      The floor is the bar a submission is checked against, which is why it
      is stated; the oracle's own CAI and the measured spreads are in
      gold/gold.json.

split_constraint: >
  These two instantiations MUST NOT be split across the public and private sets.
  Measured across the two golds, 3 of 6 graded sub-answers coincide: the binding
  constraint for each of the two hosts, and one of the two non-binding sets. A
  system that has solved the public half can transfer those to the private half
  without recomputing anything.

  What does differ, and is what this instantiation actually adds: every
  unconstrained-violation count for both hosts, the other non-binding set, and
  the flipped-constraint set. So R3's six integer components and R4's flipped
  set remain real work while R3's binding-constraint component does not.

  Neither the counts nor the constraint names are written here, in either
  instantiation. They are what R3 and R4 grade. An earlier version of this note
  printed all six of R3's integers for both hosts plus R4's swapped
  direct-repeat count; the version after it removed the integers but kept
  naming which constraint binds in each host, which is the same disclosure in
  words. Which constraints these are, where the two instantiations differ, and
  by how much, is in docs/npbench-c.md, which the sandbox never sees.

  If the private set needs a construct-design campaign, author a third
  instantiation whose binding constraint genuinely differs from both of these --
  a protein and host pairing whose bottleneck is a different constraint, which
  gold/gold.json names for each of these two -- rather than reusing either.

notes_for_audit:
  - >
    The CAI relative-adaptiveness tables are derived, not asserted: for each
    host, every CDS of a pinned INSDC record whose product names a ribosomal
    protein, validated against the record's own translation, counted codon
    by codon, and divided by the most-used codon of each synonymous family.
    The rule, the accessions, the gene counts and the digest of each gene
    set are in reference/codon_tables.json under provenance; the per-codon
    counts and the gene list are in audit/codon_table_provenance.json, which
    no sandbox sees. Regenerate with
    npbench_c.templates.construct_design.prepare_tables, which refuses to
    write a table whose reference set no longer matches the manifest. The
    earlier tables were representative values with no citable source; the
    change moved 20 of this campaign's 41 gold keys, three of them among
    the twelve unconstrained-violation counts, and 17 of 41 in the other
    instantiation. It moved nothing at all in the two constraint campaigns
    on the same tables, whose arithmetic uses the codon sets but not the
    weights.
