[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biomni-benchmark"
version = "0.1.0"
description = "A single CLI command to benchmark Biomni over Q&A pairs with a configurable LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "biomni",
    "tqdm",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]
# NPBench-C's grading core is stdlib-only by design: a numpy or pandas version
# bump must never be able to move a published score. PyYAML is used only by the
# readiness gate, which is outside the scoring path.
npbench = ["pyyaml"]

[project.scripts]
biomni-benchmark = "biomni_benchmark.cli:main"
npbench-c-readiness = "npbench_c.readiness.gate:main"

[tool.setuptools.packages.find]
where = ["src"]
